<style>

priv:'🔒 Procesado 100% en tu dispositivo: no se graba, no se guarda y no se envía ninguna imagen.',title:'MAY · Lenguaje gestual (simulado)',sub:'MAY percibe tus gestos y, según el estímulo, así reacciona. Un juego.',
open:'📷 Abrir cámara',stop:'⏹ Parar cámara',cal:'🎯 Calibrar',handsL:'Manos',voiceL:'Voz de MAY',ph:'Pulsa «Abrir cámara». Funciona en móvil, tablet y portátil (HTTPS).',calT:'Mira al punto central 2 s…',
gameT:'Lenguaje gestual · juego',gameNote:'Interpretaciones populares, no ciencia. Solo un juego.',demoT:'Modo demo',demoN:'(sin cámara: simula un gesto)',limT:'Límites',

hi:'¡Hola! Soy MAY 💙 Abre la cámara o prueba el modo demo y te diré qué percibo (simulado).',loading:'Cargando modelo de visión…',ready:'Cámara activa. Calibra mirando al centro para mejorar la mirada.',denied:'No se pudo abrir la cámara. Usa el modo demo.',stopped:'Cámara parada.',calOk:'Calibrado ✔',noface:'No veo tu cara',perc:'MAY percibe',reac:'reacción (simulado)',
lim:['La mirada se estima a partir de la cara; luz, gafas y ángulo afectan.','No detecta mentiras ni lee mentes; las interpretaciones son creencias populares.','Las emociones son simuladas: un gesto no equivale a un sentimiento.','Requiere navegador moderno y permiso de cámara; el modelo se descarga de un CDN.']},

hi:'Hi! I\'m MAY 💙 Open the camera or try demo mode and I\'ll tell you what I perceive (simulated).',loading:'Loading vision model…',ready:'Camera on. Calibrate by looking at the center for better gaze.',denied:'Could not open the camera. Use demo mode.',stopped:'Camera stopped.',calOk:'Calibrated ✔',noface:'No face seen',perc:'MAY perceives',reac:'reaction (simulated)',

// gesture: [label es, label en, interpretation es, en, MAY es, en]
const G={up:['Mirada arriba','Looking up','¿imaginando? (creencia popular)','imagining? (popular belief)','Miras hacia arriba… ¿estás imaginando algo bonito? ✨','Looking up… imagining something lovely? ✨'],
down:['Mirada abajo','Looking down','¿recordando o pensando sentimientos? (creencia popular)','remembering or feeling? (popular belief)','Miras hacia abajo… si es un recuerdo, que sea dulce 💙','Looking down… if it\'s a memory, may it be sweet 💙'],
left:['Mirada izquierda','Looking left','¿escuchando/recordando sonidos? (creencia popular)','listening/recalling sounds? (popular belief)','Miras a un lado… ¿recuerdas una canción? 🎶','Looking aside… recalling a song? 🎶'],
right:['Mirada derecha','Looking right','¿escuchando/recordando sonidos? (creencia popular)','listening/recalling sounds? (popular belief)','Miras al otro lado… ¿oyes algo? 🎧','Looking the other way… hearing something? 🎧'],

frown:['Ceño','Frown','concentración/enfado','focus/anger','Te noto concentrado, ¿te ayudo? (simulado)','You seem focused, can I help? (simulated)'],
brows:['Cejas arriba','Brows raised','sorpresa','surprise','¡Oh! ¿Te he sorprendido? 😮','Oh! Did I surprise you? 😮'],
mouth:['Boca abierta','Mouth open','asombro o hablar','awe or speaking','¿Querías decirme algo? Te escucho 👂','Want to tell me something? I\'m listening 👂'],
blink:['Parpadeo','Blink','descanso','rest','Parpadeas, ¡descansa la vista cuando quieras! 🌙','You blinked, rest your eyes whenever you like! 🌙'],
tilt:['Cabeza inclinada','Head tilted','curiosidad','curiosity','Inclinas la cabeza… ¿curiosidad? 🤔','Tilting your head… curious? 🤔'],
palm:['Palma abierta','Open palm','saludo','greeting','¡Hola! Te devuelvo el saludo 👋','Hi! Waving back 👋'],
thumb:['Pulgar arriba','Thumbs up','aprobación','approval','¡Gracias! Me alegra que te guste 👍','Thanks! Glad you like it 👍'],
fist:['Puño','Fist','fuerza o tensión','strength or tension','¡Con fuerza! Pero respira hondo 💪','Strong! But take a deep breath 💪']};
const L=()=>en?'en':'es',tx=k=>T[L()][k],$=id=>document.getElementById(id);
function render(){document.documentElement.lang=L();document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tx(e.dataset.i));$('lang').textContent=en?'ES':'EN';
$('tbl').innerHTML=Object.values(G).map(g=>`<tr><td>${en?g[1]:g[0]}</td><td>→ <b>${en?g[3]:g[2]}</b></td></tr>`).join('');
$('demoB').innerHTML='';Object.keys(G).forEach(k=>{const b=document.createElement('button');b.className='btn';b.textContent=en?G[k][1]:G[k][0];b.onclick=()=>react(k,true);$('demoB').appendChild(b)});
$('lim').innerHTML=tx('lim').map(x=>`<li>${x}</li>`).join('');if(!last)$('say').textContent=tx('hi')}
$('lang').onclick=()=>{en=!en;render()};
$('av').innerHTML='<defs><linearGradient id="gm" x1="0" x2="1"><stop offset="0" stop-color="#22e6ff"/><stop offset="1" stop-color="#c04bff"/></linearGradient></defs><circle cx="20" cy="20" r="18" fill="#0f1a38" stroke="url(#gm)" stroke-width="2"/><circle cx="14" cy="17" r="2.5" fill="#22e6ff"/><circle cx="26" cy="17" r="2.5" fill="#22e6ff"/><path id="mo" d="M13 26 Q20 31 27 26" stroke="#c04bff" stroke-width="2" fill="none"/>';
let last=null,lastT=0,lastSpeak=0;
function react(k,force){const now=Date.now();if(!force&&(k==last&&now-lastT<9000||now-lastT<3500))return;last=k;lastT=now;const g=G[k];
$('say').textContent=en?g[5]:g[4];$('perc').textContent=`${tx('perc')}: ${en?g[1]:g[0]} → ${tx('reac')}`;$('av').classList.remove('talk');void $('av').offsetWidth;$('av').classList.add('talk');
if($('voice').checked&&'speechSynthesis'in window&&now-lastSpeak>6000){lastSpeak=now;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance((en?g[5]:g[4]).replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,''));u.lang=en?'en-US':'es-ES';u.pitch=1.25;u.rate=.95;
const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith(en?'en':'es')&&/female|mujer|helena|laura|elvira|monica|paulina/i.test(v.name))||speechSynthesis.getVoices().find(v=>v.lang.startsWith(en?'en':'es'));if(v)u.voice=v;speechSynthesis.speak(u)}}

<script type="module">
const $=id=>document.getElementById(id),st=m=>$('status').firstChild.textContent=m,tx=k=>document.documentElement.lang=='en'?TT(k,'en'):TT(k,'es');
function TT(k,l){return window.__T?window.__T[l][k]:k}
window.__T=T;
const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
let face,hand,stream,raf,base={x:0,y:0},calib=null,cnt={};
const v=$('v'),ov=$('ov'),cx=ov.getContext('2d');
async function load(){if(face)return;st(tx('loading'));const m=await import(V+'/vision_bundle.mjs');const fs=await m.FilesetResolver.forVisionTasks(V+'/wasm');
const mk=(C,url,o)=>C.createFromOptions(fs,{baseOptions:{modelAssetPath:url,delegate:'GPU'},runningMode:'VIDEO',...o}).catch(()=>C.createFromOptions(fs,{baseOptions:{modelAssetPath:url,delegate:'CPU'},runningMode:'VIDEO',...o}));
face=await mk(m.FaceLandmarker,'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',{numFaces:1,outputFaceBlendshapes:true});
try{hand=await mk(m.HandLandmarker,'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',{numHands:1})}catch(e){hand=null}}
$('open').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw 0;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
v.srcObject=stream;await v.play();$('ph').style.display='none';$('stop').disabled=false;$('cal').disabled=false;$('open').disabled=true;await load();st(tx('ready'));loop()}catch(e){console.warn(e);st(tx('denied'));$('demo').scrollIntoView({behavior:'smooth'})}};
$('stop').onclick=()=>{cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());v.srcObject=null;stream=null;$('ph').style.display='flex';$('tags').innerHTML='';cx.clearRect(0,0,ov.width,ov.height);$('stop').disabled=$('cal').disabled=true;$('open').disabled=false;st(tx('stopped'))};
$('cal').onclick=()=>{calib={t:performance.now(),xs:[],ys:[]};$('calib').style.display='flex'};
function gaze(b){const s=n=>b[n]||0;return{x:(s('eyeLookOutLeft')+s('eyeLookInRight'))/2-(s('eyeLookInLeft')+s('eyeLookOutRight'))/2,y:(s('eyeLookUpLeft')+s('eyeLookUpRight'))/2-(s('eyeLookDownLeft')+s('eyeLookDownRight'))/2}}
function handG(l){const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),w=l[0],ext=[8,12,16,20].map(i=>d(l[i],w)>d(l[i-2],w)*1.1);const n=ext.filter(Boolean).length;
const thumbUp=l[4].y<l[3].y&&l[4].y<l[5].y-0.05&&n==0;if(thumbUp)return'thumb';if(n>=4)return'palm';if(n==0)return'fist';return null}
let lt=-1;
function loop(){raf=requestAnimationFrame(loop);if(!face||v.readyState<2||v.currentTime==lt)return;lt=v.currentTime;const now=performance.now();
ov.width=v.videoWidth;ov.height=v.videoHeight;cx.clearRect(0,0,ov.width,ov.height);const r=face.detectForVideo(v,now),tags=[];
if(r.faceLandmarks?.length){const lm=r.faceLandmarks[0],b={};(r.faceBlendshapes[0]?.categories||[]).forEach(c=>b[c.categoryName]=c.score);
cx.fillStyle='#22e6ff';for(const i of [468,473,33,263,1,13,14])if(lm[i])cx.fillRect(lm[i].x*ov.width-2,lm[i].y*ov.height-2,4,4);
const g=gaze(b);if(calib){calib.xs.push(g.x);calib.ys.push(g.y);if(now-calib.t>2000){const a=x=>x.reduce((p,q)=>p+q,0)/Math.max(1,x.length);base={x:a(calib.xs),y:a(calib.ys)};calib=null;$('calib').style.display='none';st(tx('calOk'))}}
const gx=g.x-base.x,gy=g.y-base.y;let gd='center';if(gy>.18)gd='up';else if(gy<-.22)gd='down';else if(gx>.25)gd='left';else if(gx<-.25)gd='right';
// mirror: video is shown mirrored, so the user's left appears on their left
tags.push(gd);const roll=Math.atan2(lm[263].y-lm[33].y,lm[263].x-lm[33].x)*180/Math.PI;if(Math.abs(roll)>14)tags.push('tilt');
if((b.eyeBlinkLeft+b.eyeBlinkRight)/2>.55)tags.push('blink');if((b.mouthSmileLeft+b.mouthSmileRight)/2>.5)tags.push('smile');
if((b.browDownLeft+b.browDownRight)/2>.45)tags.push('frown');if(b.browInnerUp>.5)tags.push('brows');if(b.jawOpen>.4)tags.push('mouth');
}else tags.push('none');
if(hand&&$('hands').checked){const h=hand.detectForVideo(v,now+0.1);if(h.landmarks?.length){const k=handG(h.landmarks[0]);if(k)tags.push(k);cx.fillStyle='#c04bff';h.landmarks[0].forEach(p=>cx.fillRect(p.x*ov.width-2,p.y*ov.height-2,4,4))}}
const en=document.documentElement.lang=='en';$('tags').innerHTML=tags.map(k=>`<span class="tag">${k=='none'?tx('noface'):(en?G[k][1]:G[k][0])}</span>`).join('');
// stable perception: prefer expressive gestures over gaze; require ~8 consecutive frames
const pri=['palm','thumb','fist','smile','frown','brows','mouth','tilt','up','down','left','right','blink','center'];const k=pri.find(p=>tags.includes(p));
for(const p in cnt)if(p!=k)cnt[p]=0;if(k){cnt[k]=(cnt[k]||0)+1;if(cnt[k]==8)react(k)}}
</script>
