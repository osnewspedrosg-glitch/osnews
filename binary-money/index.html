<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSNews Binary Money — simulación educativa</title><meta name="description" content="Simulación educativa de dinero binario, pago con móvil y Renta Básica Universal en puntos. No es un banco.">
<style>
:root{--bg:#05070f;--card:#0d1326;--ln:#1f2b52;--c:#22e6ff;--m:#c04bff;--g:#3dff9a;--r:#ff4d6d;--t:#dfe8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#13204a,var(--bg) 60%);color:var(--t);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:18px;text-align:center}h1{margin:.2em 0;font-size:1.8em;background:linear-gradient(90deg,var(--c),var(--m));-webkit-background-clip:text;color:transparent;letter-spacing:.04em}
.banner{background:#3a0d1a;border:1px solid var(--r);color:#ffd0d9;padding:8px;text-align:center;font-weight:600}
nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px}nav button,.btn{background:#0f1a38;color:var(--t);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;cursor:pointer}
nav button.on,.btn.p{border-color:var(--c);box-shadow:0 0 10px #22e6ff55;color:var(--c)}
main{max-width:1050px;margin:auto;padding:10px}section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
input,select{background:#081028;color:var(--t);border:1px solid var(--ln);border-radius:8px;padding:7px;width:100%}label{font-size:.85em;color:#9fb0d8}
.acc{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--ln)}.acc b{color:var(--g)}
.route{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.9em}.route span{border:1px solid var(--m);border-radius:8px;padding:3px 7px}
.rec{font-family:ui-monospace,monospace;font-size:.75em;border-left:3px solid var(--c);padding:6px 8px;margin:6px 0;background:#070c1c;word-break:break-all}.rec.bad{border-color:var(--r);background:#2a0a12}
.bin{color:#6f84b8;max-height:3.6em;overflow:hidden}.ok{color:var(--g);font-weight:700}.ko{color:var(--r);font-weight:700}
.screens{display:grid;grid-template-columns:1fr 1fr;gap:14px}.dev{border:2px solid var(--c);border-radius:26px;padding:16px;min-height:280px;background:#040815;text-align:center}
.dev.shop{border-color:var(--m);border-radius:12px}.big{font-size:2em;font-weight:800}.okbig{font-size:2.6em;color:var(--g);text-shadow:0 0 18px var(--g)}
.wifi{text-align:center;color:var(--c);letter-spacing:.3em}footer{text-align:center;padding:20px;color:#8796c0;font-size:.85em}
.pill{display:inline-block;font-size:.75em;border:1px solid #ffb84d;color:#ffb84d;border-radius:20px;padding:1px 8px}
@media(max-width:600px){.screens{grid-template-columns:1fr}}
</style></head><body>
<div class="banner" data-i="banner"></div>
<header><h1>OSNews Binary Money</h1><div data-i="sub"></div><button class="btn" id="lang" style="margin-top:8px">EN</button></header>
<nav><button data-s="portal" class="on" data-i="t1"></button><button data-s="tx" data-i="t2"></button><button data-s="pay" data-i="t3"></button><button data-s="rvb" data-i="t4"></button><button data-s="col" data-i="t6"></button><button data-s="how" data-i="t5"></button></nav>
<main>
<section id="portal" class="on"><div class="card"><h3 data-i="t1"></h3><div class="grid"><div><label data-i="who"></label><select id="me"></select><div id="mine" style="margin-top:8px"></div></div><div id="accs"></div></div>
<div class="grid" style="margin-top:10px"><div><label data-i="newacc"></label><input id="nn" placeholder="Lucía"></div><div><label data-i="bal0"></label><input id="nb" type="number" value="100"></div><div style="align-self:end"><button class="btn p" id="add" data-i="create"></button> <button class="btn" id="reset" data-i="reset"></button></div></div></div></section>
<section id="tx"><div class="card"><h3 data-i="t2"></h3><div class="grid"><div><label data-i="from"></label><select id="f"></select></div><div><label data-i="to"></label><select id="to"></select></div><div><label data-i="amt"></label><input id="a" type="number" value="5000"></div><div><label><span data-i="taxp"></span> <span class="pill" data-i="ex"></span></label><input id="tp" type="number" value="21"></div></div>
<p class="route" id="rt"></p><button class="btn p" id="send" data-i="send"></button> <button class="btn" id="demo" data-i="demo"></button> <span id="msg"></span></div>
<div class="card"><h3 data-i="ledger"></h3><button class="btn p" id="ver" data-i="verify"></button> <button class="btn" id="tam" data-i="tamper"></button> <span id="vr"></span><div id="led"></div></div></section>
<section id="pay"><div class="card"><h3 data-i="t3"></h3><p data-i="paytxt"></p><div class="screens"><div class="dev"><div>📱 <span data-i="phone"></span></div><div id="ph"></div></div><div class="dev shop"><div>🏪 <span data-i="shop"></span></div><div id="sh"></div></div></div>
<p class="wifi">· · · wifi · · ·</p><button class="btn p" id="pbtn" data-i="paybtn"></button> <span id="pm"></span></div></section>
<section id="rvb"><div class="card"><h3 data-i="t4"></h3><p data-i="rvbtxt"></p><span class="pill" data-i="ex2"></span>
<div class="grid" style="margin-top:8px"><div><label data-i="lp"></label><input id="lp" type="number" value="200"></div><div><label data-i="food"></label><input class="bx" data-k="comida" type="number" value="300"></div><div><label>Internet</label><input class="bx" data-k="internet" type="number" value="40"></div><div><label data-i="elec"></label><input class="bx" data-k="luz" type="number" value="60"></div><div><label data-i="water"></label><input class="bx" data-k="agua" type="number" value="30"></div><div><label data-i="house"></label><input class="bx" data-k="vivienda" type="number" value="170"></div></div>
<p><button class="btn p" id="mon" data-i="month"></button> <span id="mm"></span></p><div id="wal" class="grid"></div></div>
<div class="card"><h3 data-i="xt"></h3><span class="pill" data-i="ex2"></span><div class="grid" style="margin-top:8px"><div><label data-i="cit"></label><select id="xc"></select></div><div><label data-i="xe"></label><input id="xe" type="number" value="940"></div><div><label data-i="xr"></label><input id="xr" type="number" value="1" step="0.01"></div><div><label data-i="xb"></label><input id="xb" type="number" value="70"></div></div>
<p id="xp"></p><button class="btn p" id="xbtn" data-i="xbtn"></button> <span id="xm"></span></div>
<div class="card"><h3 data-i="pt"></h3><p data-i="ptxt"></p><span class="pill" data-i="ex2"></span><div class="grid" style="margin-top:8px"><div><label data-i="pco"></label><select id="pc"><option>Tienda Demo</option><option>Super Ejemplo</option><option>Telco Ejemplo</option></select></div><div><label data-i="ppts"></label><input id="pp" type="number" value="2500"></div><div><label data-i="goal"></label><input id="pg" type="number" value="10000"></div><div style="align-self:end"><button class="btn p" id="pf" data-i="pfb"></button></div></div>
<p><span data-i="road"></span>: <b id="pv" class="ok">0%</b></p><div style="background:#081028;border:1px solid var(--ln);border-radius:10px;height:18px;overflow:hidden"><div id="pbar" style="height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--g))"></div></div></div>
<div class="card"><h3 data-i="ti"></h3><div class="grid"><div><label data-i="cit"></label><select id="tc"></select></div><div><label data-i="olddev"></label><select id="td"><option value="phone">📱 phone</option><option value="laptop">💻 laptop</option><option value="tablet">tablet</option><option value="tv">📺 TV</option></select></div><div><label data-i="cond"></label><select id="tq"><option value="good">✅ good</option><option value="fair">🟡 fair</option><option value="broken">❌ broken</option></select></div><div><label data-i="newp"></label><input id="tn" type="number" value="500"></div></div>
<p><button class="btn p" id="tib" data-i="tib"></button> <span id="tim"></span></p></div></section>
<section id="col"><div class="card"><h3 data-i="t6"></h3><p data-i="coltxt"></p><span class="pill" data-i="ex2"></span>
<div class="grid" style="margin-top:8px"><div><label data-i="cit"></label><select id="cc"></select></div><div><label data-i="ctype"></label><select id="ct"><option value="idea">💡 idea</option><option value="arte">🎨 arte / art</option><option value="musica">🎵 música / music</option><option value="codigo">💻 código / code</option><option value="ayuda">🤝 ayuda / volunteering</option></select></div><div><label data-i="stars"></label><select id="cs"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div><div><label data-i="sys"></label><input id="sp" type="number" value="2000"></div></div>
<p><button class="btn" id="feed" data-i="feed"></button> <button class="btn p" id="cb" data-i="cbtn"></button> <span id="cm"></span></p><p id="bank"></p><div id="lad" class="route"></div></div></section>
<section id="how"><div class="card"><h3 data-i="t5"></h3><div id="howt"></div></div></section>
</main>
<footer><div data-i="foot1"></div><div data-i="foot2"></div><div style="margin-top:6px"><a href="../" style="color:var(--c)">OSNews · MAY</a></div></footer>
<script src="core.js"></script>
<script>
const T={es:{banner:"Simulación educativa: no es un banco ni mueve dinero real",sub:"Dinero binario: origen → beb → banco → Hacienda → destino · pago con móvil · Renta Básica Universal en puntos",t1:"Mi portal",t2:"Transferencias",t3:"Pagar con móvil",t4:"Renta Básica Universal",t5:"Cómo funciona",who:"Soy:",newacc:"Nueva cuenta demo",bal0:"Saldo inicial (€ ficticios)",create:"Crear",reset:"Reiniciar demo",from:"Origen",to:"Destino",amt:"Importe (€ ficticios)",taxp:"Impuesto %",ex:"ejemplo",send:"Enviar",demo:"Demo: 5000+500+1000+20000 → Pedro",ledger:"Libro binario con cadena de hashes SHA-256",verify:"Verificar cadena",tamper:"Manipular un registro",okc:"✔ Cadena íntegra",koc:"✘ Manipulación detectada en registro #",paytxt:"Móvil y tienda se conectan por wifi. En lugar del número de tarjeta se genera un token de un solo uso. «The end tarjeta física».",phone:"Móvil de Pedro",shop:"Pantalla de la Tienda",paybtn:"Pagar 90 €",card:"Tarjeta virtual",bank:"Banco (simulado)",rvbtxt:"Cada ciudadano demo recibe cada mes PUNTOS en dos monederos: (1) Básicos protegidos — comida, internet, luz, agua, vivienda — reservados, garantizados y pagados automáticamente; no se pueden gastar en otra cosa. (2) Ocio/hardware — gasto libre, ocio y productos tecnológicos nuevos.",ex2:"Todas las cifras son valores de ejemplo editables, no datos reales",lp:"Puntos ocio/hardware al mes",food:"Comida",elec:"Luz",water:"Agua",house:"Vivienda básica",month:"▶ Simular mes",basic:"Básicos protegidos",leis:"Ocio/hardware",covered:"básicos cubiertos ✔",ti:"Renovar tecnología (entrega tu equipo viejo)",cit:"Ciudadano",olddev:"Equipo viejo",cond:"Estado",newp:"Precio del nuevo (puntos)",tib:"Entregar y canjear",credit:"Crédito por entrega",nopts:"Puntos de ocio insuficientes (los básicos no se tocan)",nos:"Saldo insuficiente",xt:"Cambio € → puntos",xe:"Euros ficticios a cambiar",xr:"Tipo: puntos por 1 € (ejemplo)",xb:"% a básicos protegidos (resto a ocio)",xbtn:"Cambiar",pt:"Empresas colaboradoras (fase de transición)",ptxt:"Hasta que la renta sea universal (pública), la financian empresas colaboradoras ficticias: aportan puntos al banco comunitario y aceptan puntos para básicos, ocio y hardware, y gestionan la renovación tecnológica.",pco:"Empresa colaboradora (ficticia)",ppts:"Aportación (pts, ejemplo)",goal:"Meta universal (pts, ejemplo)",pfb:"Aportar",road:"Camino a la renta universal",t6:"Colabora y gana",coltxt:"Como en la escalera de premios de una tragaperras, pero sin apostar: contribuir nunca cuesta puntos. Aporta ideas, arte, música, código o ayuda; la IA/comunidad (simulada) valora de 1 a 5 ★ y subes peldaños de la escalera (0,20 … 1500 pts), con un pequeño giro de bonus. Paga un banco comunitario que se llena con el 75 % de una aportación del sistema. Los puntos ganados van SOLO al monedero de ocio/hardware.",ctype:"Tipo de aportación",stars:"Valoración IA/comunidad (★)",sys:"Aportación del sistema (pts, ejemplo)",feed:"Alimentar banco (75 %)",cbtn:"Aportar y valorar",cbank:"Banco comunitario",needm:"Primero simula un mes en Renta Básica Universal",foot1:"Idea original: Pedro Sánchez Gómez (apuntes a mano).",foot2:"Me creó Pedro Sánchez Gómez, del Mar Menor, con la ayuda de Copilot y Grok.",
how:"<p><b>1.</b> Cada usuario tiene un portal web personal con su saldo (aquí, guardado solo en tu navegador).</p><p><b>2.</b> Varias empresas envían importes a un nodo central («beb», business enterprise bank) → banco → Hacienda retiene el impuesto → llega el neto al destino.</p><p><b>3.</b> Cada movimiento se guarda como texto y en <b>binario</b>, y se encadena con un hash SHA-256 del anterior: si alguien cambia un dato, la verificación lo detecta.</p><p><b>4.</b> Pago con móvil: el teléfono no envía el número de tarjeta, sino un token de un solo uso; las dos pantallas muestran nombre, tarjeta, banco, importe y OK.</p><p><b>5.</b> Renta Básica Universal en puntos: lo esencial siempre cubierto; el ocio y la tecnología, aparte, con renovación por entrega y reciclaje.</p><p><i>Nota: los sistemas reales usan tokenización, chip EMV y autenticación reforzada del cliente (SCA, directiva PSD2). Esto es solo una demo educativa: no hay bancos reales, ni tarjetas reales, ni dinero real, ni se recogen datos.</i></p>"},
en:{banner:"Educational simulation: not a bank, moves no real money",sub:"OSNews Binary Money · Universal Basic Income in points",t1:"My portal",t2:"Transfers",t3:"Pay with phone",t4:"Universal Basic Income (UBI)",t5:"How it works",who:"I am:",newacc:"New demo account",bal0:"Starting balance (fictional €)",create:"Create",reset:"Reset demo",from:"Origin",to:"Destination",amt:"Amount (fictional €)",taxp:"Tax %",ex:"example",send:"Send",demo:"Demo: 5000+500+1000+20000 → Pedro",ledger:"Binary ledger with SHA-256 hash chain",verify:"Verify chain",tamper:"Tamper with a record",okc:"✔ Chain intact",koc:"✘ Tampering detected at record #",paytxt:"Phone and shop connect over wifi. Instead of a card number, a one-time token is generated. “The end of the physical card”.",phone:"Pedro's phone",shop:"Shop screen",paybtn:"Pay €90",card:"Virtual card",bank:"Bank (simulated)",rvbtxt:"Every demo citizen gets monthly POINTS in two wallets: (1) Protected basics — food, internet, electricity, water, housing — reserved, guaranteed and auto-paid; they can't be spent on anything else. (2) Leisure/hardware — free spending, leisure and new tech products.",ex2:"All figures are editable example values, not real data",lp:"Leisure/hardware points per month",food:"Food",elec:"Electricity",water:"Water",house:"Basic housing",month:"▶ Simulate month",basic:"Protected basics",leis:"Leisure/hardware",covered:"basics covered ✔",ti:"Upgrade tech (trade in your old device)",cit:"Citizen",olddev:"Old device",cond:"Condition",newp:"New device price (points)",tib:"Trade in & redeem",credit:"Trade-in credit",nopts:"Not enough leisure points (basics are untouchable)",nos:"Insufficient balance",xt:"Exchange € → points",xe:"Fictional euros to exchange",xr:"Rate: points per €1 (example)",xb:"% to protected basics (rest to leisure)",xbtn:"Exchange",pt:"Partner companies (transition phase)",ptxt:"Until the basic income becomes universal (public), fictional partner companies fund it: they add points to the community bank, accept points for basics, leisure and hardware, and run the tech trade-in.",pco:"Partner company (fictional)",ppts:"Contribution (pts, example)",goal:"Universal goal (pts, example)",pfb:"Contribute",road:"Road to universal income",t6:"Contribute & earn",coltxt:"Like a slot machine prize ladder, but with no betting: contributing never costs points. Share ideas, art, music, code or help; the AI/community (simulated) rates 1–5 ★ and you climb the ladder (0.20 … 1500 pts), with a small bonus spin. Prizes come from a community bank fed with 75% of a system share. Earned points go ONLY to the leisure/hardware wallet.",ctype:"Contribution type",stars:"AI/community rating (★)",sys:"System share (pts, example)",feed:"Feed bank (75%)",cbtn:"Contribute & rate",cbank:"Community bank",needm:"First simulate a month in Universal Basic Income (UBI)",foot1:"Original idea: Pedro Sánchez Gómez (handwritten notes).",foot2:"Created by Pedro Sánchez Gómez, from the Mar Menor, with help from Copilot and Grok.",
how:"<p><b>1.</b> Each user has a personal web portal with their balance (stored only in your browser here).</p><p><b>2.</b> Several companies send amounts to a central hub (“beb”, business enterprise bank) → bank → tax office withholds tax → the net reaches the destination.</p><p><b>3.</b> Each record is stored as text and in <b>binary</b>, chained with a SHA-256 hash of the previous one: change any data and verification catches it.</p><p><b>4.</b> Phone payment: the phone sends a one-time token, not the card number; both screens show name, card, bank, amount and OK.</p><p><b>5.</b> Universal Basic Income (UBI) in points: essentials always covered; leisure and tech separate, with trade-in and recycling.</p><p><i>Note: real systems use tokenisation, EMV chips and strong customer authentication (SCA, PSD2). This is only an educational demo: no real banks, cards or money, and no data is collected.</i></p>"}};
const QL=new URLSearchParams(location.search).get('lang');let L=(QL=='en'||QL=='es')?QL:(localStorage.bmLang||'es'),st;const K='bm-state-v1',$=id=>document.getElementById(id),tr=k=>T[L][k]||k,eur=c=>(c/100).toLocaleString(L,{minimumFractionDigits:2})+' €';
function load(){try{st=JSON.parse(localStorage[K])}catch(e){}if(!st||!st.accounts)st=BM.newState();}function save(){localStorage[K]=JSON.stringify(st);}
function i18n(){document.documentElement.lang=L;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));$('howt').innerHTML=tr('how');$('lang').textContent=L=='es'?'EN':'ES';render();}
function opts(sel,v){const o=Object.keys(st.accounts);sel.innerHTML=o.map(n=>`<option>${n.replace(/</g,'')}</option>`).join('');if(v&&o.includes(v))sel.value=v;}
function render(){const me=$('me').value||'Pedro';opts($('me'),me);opts($('f'),$('f').value||'Empresa A');opts($('to'),$('to').value||'Pedro');
$('accs').innerHTML=Object.entries(st.accounts).map(([n,c])=>`<div class="acc"><span>${n.replace(/</g,'')}</span><b>${eur(c)}</b></div>`).join('');
$('mine').innerHTML=`<div class="big">${eur(st.accounts[$('me').value]||0)}</div><small>${st.ledger.filter(r=>r.from==$('me').value||r.to==$('me').value).length} mov.</small>`;
$('rt').innerHTML=[$('f').value,'beb',tr('bank'),'Hacienda ('+$('tp').value+'%)',$('to').value].map(x=>`<span>${x}</span>`).join(' → ');
$('led').innerHTML=st.ledger.slice().reverse().slice(0,40).map(r=>{const isPts=r.type.startsWith('rvb')||r.type=='leisure'||r.type=='contrib'||r.type=='partner-fund'||r.type.startsWith('tradein')||r.type=='recycle';const amt=r.type=='exchange'?eur(r.amount)+' → '+r.net+' pts':isPts?r.amount+' pts':eur(r.amount)+(r.tax?` · tax ${eur(r.tax)} · net ${eur(r.net)}`:'');return `<div class="rec${r.bad?' bad':''}">#${r.i} [${r.type}] ${String(r.from).replace(/</g,'')} → ${String(r.to).replace(/</g,'')} · ${amt}${r.token?' · '+r.token:''}<br>hash ${r.hash.slice(0,32)}… prev ${r.prev.slice(0,12)}…<div class="bin">${BM.toBin(BM.payload(r)).slice(0,300)}…</div></div>`}).join('');
const P=st.pts||{};$('wal').innerHTML=Object.entries(P).map(([c,w])=>`<div class="card"><b>${c}</b><div>🛡 ${tr('basic')}: ${w.basic} pts</div><div>🎮 ${tr('leis')}: ${w.leisure} pts</div></div>`).join('');
opts($('tc'),$('tc').value||'Pedro');opts($('xc'),$('xc').value||'Pedro');$('cc').innerHTML=Object.keys(P).map(n=>`<option>${n}</option>`).join('');$('bank').innerHTML=`🏦 ${tr('cbank')}: <b class="ok">${st.cbank||0} pts</b>`;$('lad').innerHTML=BM.LADDER.map((v,i)=>`<span id="L${i}">${v}</span>`).join('');}
async function doTx(f,t,a,p,x){try{const r=await BM.transfer(st,f,t,a,p,x);save();render();return r}catch(e){$('msg').textContent=tr('nos');$('pm').textContent=tr('nos');throw e}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(e=>e.classList.remove('on'));b.classList.add('on');$(b.dataset.s).classList.add('on')});
$('lang').onclick=()=>{L=L=='es'?'en':'es';localStorage.bmLang=L;i18n()};
['me','f','to','tp'].forEach(i=>$(i).oninput=render);
$('add').onclick=()=>{const n=$('nn').value.trim().slice(0,20);if(n&&!(n in st.accounts)){st.accounts[n]=BM.cents($('nb').value||0);save();render();}};
$('reset').onclick=()=>{st=BM.newState();save();render()};
$('send').onclick=async()=>{$('msg').textContent='';await doTx($('f').value,$('to').value,$('a').value,$('tp').value);$('msg').innerHTML='<span class="ok">OK</span>'};
$('demo').onclick=async()=>{for(const [f,a] of [['Empresa A',5000],['Empresa B',500],['Empresa C',1000],['Empresa D',20000]]){if(st.accounts[f]>=BM.cents(a))await doTx(f,'Pedro',a,$('tp').value)}$('msg').innerHTML='<span class="ok">OK</span>'};
$('ver').onclick=async()=>{const v=await BM.verify(st);st.ledger.forEach(r=>r.bad=(!v.ok&&r.i==v.at));render();$('vr').innerHTML=v.ok?`<span class="ok">${tr('okc')}</span>`:`<span class="ko">${tr('koc')}${v.at}</span>`};
$('tam').onclick=()=>{if(!st.ledger.length)return;const r=st.ledger[Math.floor(Math.random()*st.ledger.length)];r.amount+=100;save();render();$('vr').textContent='⚠ #'+r.i};
function screens(tok,ok){const s=`<p>Pedro</p><p>${tr('card')}: ${tok||'—'}</p><p>${tr('bank')}</p><div class="big">90,00 €</div>${ok?'<div class="okbig">OK</div>':''}`;$('ph').innerHTML=s;$('sh').innerHTML=s.replace('<p>Pedro</p>','<p>Pedro → Tienda</p>');}
$('pbtn').onclick=async()=>{const tok=BM.token();screens(tok,false);$('pm').textContent='…';setTimeout(async()=>{try{await doTx('Pedro','Tienda',90,0,{type:'phone-pay',token:tok});screens(tok,true);$('pm').innerHTML='<span class="ok">OK · ledger ✔</span>'}catch(e){}},700)};
$('mon').onclick=async()=>{const b={};document.querySelectorAll('.bx').forEach(i=>b[i.dataset.k]=Math.max(0,Number(i.value)||0));const bt=Object.values(b).reduce((x,y)=>x+y,0);const o=await BM.monthly(st,['Pedro','Tienda'],{basicPts:bt,leisurePts:Math.max(0,Number($('lp').value)||0),basics:b});save();render();$('mm').innerHTML=`<span class="ok">M${st.month}: ${o.every(x=>x.ok)?tr('covered'):'!'}</span>`};
$('tib').onclick=async()=>{const c=$('tc').value;if(!(st.pts&&st.pts[c])){$('tim').textContent=tr('nopts');return}const cr=Math.round(BM.DEV[$('td').value]*BM.COND[$('tq').value]);try{await BM.tradeIn(st,c,$('td').value,$('tq').value,Math.max(0,Number($('tn').value)||0));save();render();$('tim').innerHTML=`<span class="ok">${tr('credit')}: ${cr} pts · ♻ OK</span>`}catch(e){$('tim').textContent=tr('nopts')}};
$('feed').onclick=()=>{BM.feedBank(st,Math.max(0,Number($('sp').value)||0));save();render()};
$('cb').onclick=async()=>{const c=$('cc').value;if(!c){$('cm').textContent=tr('needm');return}const o=await BM.contribute(st,c,$('ct').value,Number($('cs').value));save();render();const e=$('L'+o.step);if(e){e.style.background='#3dff9a33';e.style.borderColor='#3dff9a'}$('cm').innerHTML=`<span class="ok">🎰 +${o.bonus} → ${o.prize} pts</span>`};
function bar(){const p=Math.min(100,Math.round((st.funded||0)/(Number($('pg').value)||1)*1000)/10);$('pv').textContent=p+'%';$('pbar').style.width=p+'%'}
$('pf').onclick=async()=>{try{await BM.partnerFund(st,$('pc').value,$('pp').value,$('pg').value);save();render();bar()}catch(e){}};$('pg').oninput=bar;
function xprev(){const p=Math.round((Number($('xe').value)||0)*(Number($('xr').value)||0)),b=Math.round(p*(Number($('xb').value)||0)/100);$('xp').innerHTML=`${$('xe').value} € → <b>${p} pts</b> = 🛡 ${b} + 🎮 ${p-b}`}
['xe','xr','xb'].forEach(i=>$(i).oninput=xprev);$('xbtn').onclick=async()=>{try{await BM.exchange(st,$('xc').value,$('xe').value,$('xr').value,$('xb').value);save();render();$('xm').innerHTML='<span class="ok">OK</span>'}catch(e){$('xm').textContent=tr('nos')}};
load();i18n();bar();xprev();screens('',false);
</script>
<script data-goatcounter="https://osnews-may.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body></html>
