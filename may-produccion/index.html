function save(){localStorage[K]=JSON.stringify(S)}
function add(who,txt,noSave){const d=document.createElement('div');d.className='msg '+who;d.innerHTML=(who=='may'?'<svg class="av" viewBox="0 0 40 40">'+AV+'</svg>':'')+'<div class="bub"></div>';d.querySelector('.bub').textContent=txt;$('chat').appendChild(d);$('chat').scrollTop=1e9;if(!noSave){S.log.push([who,txt]);S.log=S.log.slice(-60);save()}}
const name=p=>M.PRODUCTS[p][L];
function reply(text){const r=M.parse(text),s=S.state,es=L=='es';let o;
 switch(r.intent){
 case'greet':S.mood='🥰';o=es?'¡Hola, cielo! Soy MAY, tu agente digital de producción (simulado). Pídeme que produzca algo o pregúntame por el plan. 💜':'Hi, sweetheart! I\'m MAY, your (simulated) production agent. Ask me to produce something or about the plan. 💜';break;
 case'produce':{const x=M.produce(s,r.product,r.qty);S.mood='😊';flow();
  o=es?`¡Hecho con cariño! 🌱 Planifiqué ${fmt(x.qty)} ${name(x.product)}: ${fmt(x.energy)} kWh, ${x.robotHours.toLocaleString(L)} h de robot. Precio unitario ${x.price.toLocaleString(L,{maximumFractionDigits:2})} pts (baja con la automatización). +${fmt(x.points)} pts al fondo común. Automatización: ${x.automation.toFixed(1)} %.`
  :`Done with love! 🌱 I planned ${fmt(x.qty)} ${name(x.product)}: ${fmt(x.energy)} kWh, ${x.robotHours.toLocaleString(L)} robot-hours. Unit price ${x.price.toLocaleString(L,{maximumFractionDigits:2})} pts (falls with automation). +${fmt(x.points)} pts to the common fund. Automation: ${x.automation.toFixed(1)}%.`;break;}
 case'automate':M.automate(s);S.mood='🤩';o=es?`¡Más robots y chips en la línea! 🤖 Automatización ${s.automation.toFixed(1)} %. Ahora todo sale más barato.`:`More robots and chips on the line! 🤖 Automation ${s.automation.toFixed(1)}%. Everything gets cheaper now.`;break;
 case'ladder':{const i=M.ladderStep(s.automation);o=es?`La escalera tiene 5 pasos: ${M.LADDER.join(' → ')}. Ahora estamos en «${M.LADDER[i]}». Mientras subimos, gobiernos, multinacionales y bancos (ficticios) ceden el poder del capital. 🪜`:`The ladder has 5 steps: ${M.LADDER_EN.join(' → ')}. We are at «${M.LADDER_EN[i]}». As we climb, (fictional) governments, multinationals and banks cede the power of capital. 🪜`;show(3);break;}
 case'ubi':o=es?`La renta básica sale de lo que producimos: cada bien suma puntos a un fondo común, y yo lo reparto entre ${s.citizens} ciudadanos simulados (70 % básicos, 30 % ocio). Hay ${fmt(s.fund)} pts en el fondo. Di «paga la renta básica». 💜`:`Basic income comes from what we produce: every good adds points to a common fund, and I share it among ${s.citizens} simulated citizens (70% basics, 30% leisure). Fund: ${fmt(s.fund)} pts. Say «pay basic income». 💜`;break;
 case'arch':o=es?'Universe AI: tu tablet con IA local → conexión tipo Starlink → clouds running (Internet) → clouds.com (personas y empresas) → procesador IA → clouds.exe (ejecuta) → data centre satélite, donde el software se actualiza. ☁️ Mira la pestaña.':'Universe AI: your tablet with local AI → Starlink-type link → clouds running (Internet) → clouds.com (people & companies) → AI processor → clouds.exe (runs it) → satellite data centre, where the software updates. ☁️ See the tab.';flow();show(1);break;

 case'status':o=es?`Estado: automatización ${s.automation.toFixed(1)} %, ${s.orders} órdenes, ${fmt(s.energy)} kWh, fondo ${fmt(s.fund)} pts, paso «${M.LADDER[M.ladderStep(s.automation)]}».`:`Status: automation ${s.automation.toFixed(1)}%, ${s.orders} orders, ${fmt(s.energy)} kWh, fund ${fmt(s.fund)} pts, step «${M.LADDER_EN[M.ladderStep(s.automation)]}».`;break;

 return o}
